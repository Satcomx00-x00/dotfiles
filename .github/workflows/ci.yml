name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Prompt answers reused by every job (non-interactive chezmoi init).
env:
  CHEZMOI_PROMPTS: >-
    --promptString name="CI Tester"
    --promptString email="ci@example.com"
    --promptString editor="vim"
    --promptChoice machineType=server
    --promptBool gpgSign=false
    --promptString signingKey=""
    --promptString workEmail=""
    --promptBool headless=true

jobs:
  # ── Render every template and shellcheck the generated scripts ───────────────
  render-lint:
    name: render + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck + chezmoi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: chezmoi init (seed prompt data, no apply)
        run: chezmoi init --source="$PWD" $CHEZMOI_PROMPTS

      - name: Render scripts and shellcheck them
        run: |
          set -eu
          rc=0
          for f in home/.chezmoiscripts/*.sh.tmpl; do
            echo "::group::$f"
            if chezmoi execute-template --source="$PWD" < "$f" > /tmp/rendered.sh; then
              if [ -s /tmp/rendered.sh ]; then
                shellcheck --shell=sh --severity=warning /tmp/rendered.sh || rc=1
              else
                echo "(rendered empty — conditional script, skipped)"
              fi
            else
              echo "TEMPLATE FAILED TO RENDER" >&2; rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Validate config templates render
        run: |
          set -eu
          for f in home/dot_zshrc.tmpl home/dot_config/git/config.tmpl home/dot_config/mise/config.toml.tmpl; do
            echo "== $f =="
            chezmoi execute-template --source="$PWD" < "$f" > /dev/null
          done

  # ── End-to-end `chezmoi init --apply` on each target distro ──────────────────
  apply:
    name: apply (${{ matrix.image }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - ubuntu:24.04
          - alpine:3.20
          - rockylinux:9
    env:
      DOTFILES_SKIP_MISE_TOOLS: "1"   # validate flow without the long tool downloads
      ZELLIJ_SKIP: "1"                # never auto-start a multiplexer in CI
    steps:
      - name: Install bootstrap prerequisites
        shell: sh
        run: |
          set -eu
          if   command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends git curl ca-certificates sudo
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache git curl bash sudo shadow
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y git curl sudo
          fi

      - uses: actions/checkout@v4

      - name: chezmoi init --apply (local source)
        shell: sh
        run: |
          set -eu
          export HOME="${HOME:-/root}"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- init --apply \
            --source="$PWD" -b "$HOME/.local/bin" \
            --promptString name="CI Tester" \
            --promptString email="ci@example.com" \
            --promptString editor="vim" \
            --promptChoice machineType=server \
            --promptBool gpgSign=false \
            --promptString signingKey="" \
            --promptString workEmail="" \
            --promptBool headless=true

      - name: Assert results
        shell: sh
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          test -f "$HOME/.zshrc"                 && echo "OK ~/.zshrc"
          test -f "$HOME/.config/git/config"     && echo "OK gitconfig"
          test -f "$HOME/.config/mise/config.toml" && echo "OK mise config"
          test -d "$HOME/.oh-my-zsh"             && echo "OK oh-my-zsh external"
          test -d "$HOME/.oh-my-zsh/custom/themes/powerlevel10k" && echo "OK p10k external"
          command -v mise >/dev/null 2>&1        && echo "OK mise installed"
          command -v zsh  >/dev/null 2>&1        && echo "OK zsh installed"
          git config --get user.email | grep -q ci@example.com && echo "OK git identity"

      - name: Source ~/.zshrc in a real interactive zsh
        shell: sh
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          ZELLIJ_SKIP=1 zsh -ic 'print -r -- ZSHRC_SOURCED_OK' | grep -q ZSHRC_SOURCED_OK
