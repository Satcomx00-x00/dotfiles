name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Decision #23: minimal — lint plus a single Ubuntu apply. Every job below is a
# `make` target that already runs locally, so nothing here can fail in a way you
# cannot reproduce with one command. The only additions beyond report.md §14 are
# the freshness gates, which are what keep the generated artefacts honest.

jobs:
  # ── Fast checks: no container, no network ──────────────────────────────────
  check:
    name: render + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi and mise
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          curl -fsSL https://mise.run | MISE_INSTALL_PATH="$HOME/.local/bin/mise" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The same pinned linters the editor and the pre-commit hook use
      # (decision #45) — never a separately versioned CI copy.
      - name: Install pinned linters
        run: mise install

      # Renders every template against every machine profile, checks the
      # fixtures still match the real prompt schema, shellchecks the rendered
      # output, parses it with zsh/bash/dash, and proves the theme fan-out.
      - run: make check

  # ── Generated artefacts must be current ────────────────────────────────────
  # The anti-drift gates. Without these, "generated from a single source" is a
  # convention that decays; with them it is enforced.
  freshness:
    name: generated artefacts are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: portable.sh is regenerated from the shell layer
        run: |
          make portable
          git diff --exit-code -- portable.sh || {
            echo "::error::portable.sh is stale — run 'make portable' and commit the result"
            exit 1
          }

      - name: README tool inventory matches tools.toml
        run: |
          make docs
          git diff --exit-code -- README.md || {
            echo "::error::README is stale — run 'make docs' and commit the result"
            exit 1
          }

  # ── Secrets (decision #19) ─────────────────────────────────────────────────
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Conventional Commits (decision #22) ────────────────────────────────────
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD --verbose

  # ── End-to-end apply ───────────────────────────────────────────────────────
  # One Ubuntu run at the standard tier, per decision #23. Alpine is included
  # for one reason: it is the only cheap way to catch a musl-only failure, and
  # report.md §16 accepts that everything else reaches a server first.
  apply:
    name: apply (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            profile: server
            tier: standard
          - image: alpine:3.20
            profile: container
            tier: minimal
    steps:
      - uses: actions/checkout@v4

      # The same test/sandbox.sh a developer runs: bootstrap from a bare image,
      # apply twice, prove the second apply changes nothing, then assert.
      - name: Bootstrap and assert
        run: sh test/sandbox.sh "${{ matrix.image }}" "${{ matrix.profile }}" "${{ matrix.tier }}"

  # ── The generated single-file rc has to actually work ──────────────────────
  portable:
    name: portable.sh runs on a bare host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The freshness gate catches STALE output; this catches WRONG output —
      # the failure that once shipped a portable.sh defining zero aliases.
      - run: make verify-portable
