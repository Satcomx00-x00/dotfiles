name: Test Dotfiles

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['20.04', '22.04', '24.04']
    steps:
      - uses: actions/checkout@v4
      
      - name: Test installation on Ubuntu ${{ matrix.version }}
        run: |
          docker run --rm -v "$PWD:/dotfiles" ubuntu:${{ matrix.version }} bash -c "
            set -e
            apt-get update
            apt-get install -y curl git
            
            # Install chezmoi
            sh -c \"\$(curl -fsLS https://get.chezmoi.io)\" -- --bin-dir /usr/local/bin
            
            # Test init (dry-run)
            chezmoi init --dry-run --verbose /dotfiles
            
            echo '✅ Ubuntu ${{ matrix.version }} test passed'
          "

  test-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b /usr/local/bin
      
      - name: Validate templates
        run: |
          # Create test config
          mkdir -p ~/.config/chezmoi
          cat > ~/.config/chezmoi/chezmoi.toml <<EOF
          [data]
            name = "Test User"
            email = "test@example.com"
            editor = "vim"
            gpgSign = false
          EOF
          
          # Test all templates
          find home -name "*.tmpl" | while read template; do
            echo "Testing: $template"
            chezmoi execute-template < "$template" > /dev/null
          done
          
          echo "✅ All templates valid"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.chezmoiscripts'
          severity: warning

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test on macOS
        run: |
          # Install chezmoi
          brew install chezmoi
          
          # Test init (dry-run)
          chezmoi init --dry-run --verbose "$PWD"
          
          echo "✅ macOS test passed"
