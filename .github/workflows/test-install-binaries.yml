name: Test Install Binaries

# Runs the install-binaries.sh script for every provider in parallel
# and verifies each expected binary is accessible afterwards.
# Triggered on any change to the ci/ directory or this workflow file.

on:
  push:
    branches: ["**"]
    paths:
      - "ci/**"
      - ".github/workflows/test-install-binaries.yml"
  pull_request:
    paths:
      - "ci/**"
      - ".github/workflows/test-install-binaries.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ github.workspace }}/ci/binaries.yaml

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── apt + third-party repos (eza, helm, terraform) + direct GitHub downloads (k9s, yq, mkcert, sops) ──
  test-apt:
    name: "apt  /  direct (k9s · yq · mkcert · sops)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl wget gpg ca-certificates python3 unzip

      - name: Run installer — apt provider
        run: sudo -E bash ci/install-binaries.sh --managers=apt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify apt binaries
        run: |
          check() {
            local bin="$1"
            if command -v "$bin" >/dev/null 2>&1; then
              echo "✔  $bin  ($(command -v "$bin"))"
            else
              echo "✘  $bin  MISSING" >&2
              return 1
            fi
          }
          # Standard apt packages
          check bat || check batcat   # Ubuntu ships bat as batcat
          check btop
          check eza
          check fzf
          check helm
          check htop
          check terraform
          check zoxide
          check age
          check jq
          check direnv
          # Direct GitHub downloads → installed to /usr/local/bin
          check k9s
          check yq
          check mkcert
          check sops

      - name: Show versions
        if: always()
        run: |
          for bin in bat btop eza fzf helm htop terraform zoxide age jq direnv k9s yq mkcert sops; do
            command -v "$bin" >/dev/null 2>&1 && echo "$(command -v "$bin"): $($bin --version 2>&1 | head -1)" || true
          done

  # ── Go — one matrix entry per tool, all compiled in parallel ─────────────────
  test-go:
    name: "Go — ${{ matrix.tool }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tool: helm-docs,       module: "github.com/norwoodj/helm-docs/cmd/helm-docs@latest" }
          - { tool: kopia,           module: "github.com/kopia/kopia@latest" }
          - { tool: kubectl-explore, module: "github.com/keisku/kubectl-explore@latest" }
          - { tool: kubectl-tree,    module: "github.com/ahmetb/kubectl-tree/cmd/kubectl-tree@latest" }
          - { tool: kubectx,         module: "github.com/ahmetb/kubectx/cmd/kubectx@latest" }
          - { tool: kubens,          module: "github.com/ahmetb/kubectx/cmd/kubens@latest" }
          - { tool: crane,           module: "github.com/google/go-containerregistry/cmd/crane@latest" }
          - { tool: kubecolor,       module: "github.com/kubecolor/kubecolor@latest" }
          - { tool: stern,           module: "github.com/stern/stern@latest" }
          - { tool: vals,            module: "github.com/helmfile/vals/cmd/vals@latest" }
          - { tool: helmfile,        module: "github.com/helmfile/helmfile@latest" }
          - { tool: kubeconform,     module: "github.com/yannh/kubeconform/cmd/kubeconform@latest" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Install ${{ matrix.tool }}
        run: |
          echo "▶ go install ${{ matrix.module }}"
          go install ${{ matrix.module }}

      - name: Verify ${{ matrix.tool }}
        run: |
          if command -v "${{ matrix.tool }}" >/dev/null 2>&1; then
            echo "✔  ${{ matrix.tool }}  ($(command -v '${{ matrix.tool }}'))"
          else
            echo "✘  ${{ matrix.tool }}  MISSING" >&2
            exit 1
          fi

  # ── GitHub Releases (fd · zellij · bob · ripgrep) ────────────────────────────
  test-github:
    name: "GitHub Releases (fd · zellij · bob · ripgrep)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl python3 unzip

      - name: Run installer — github provider
        run: sudo -E bash ci/install-binaries.sh --managers=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify github binaries
        run: |
          check() {
            local bin="$1"
            if command -v "$bin" >/dev/null 2>&1; then
              echo "✔  $bin  ($(command -v "$bin"))"
            else
              echo "✘  $bin  MISSING" >&2
              return 1
            fi
          }
          check fd
          check zellij
          check bob
          check rg          # ripgrep
          check kyverno     # kyverno CLI (downloaded from github releases)

      - name: Show versions
        if: always()
        run: |
          for bin in fd zellij bob rg kyverno; do
            command -v "$bin" >/dev/null 2>&1 && echo "$(command -v "$bin"): $($bin --version 2>&1 | head -1)" || true
          done

  # ── Pip ──────────────────────────────────────────────────────────────────────
  test-pip:
    name: "Pip"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run installer — pip provider
        run: bash ci/install-binaries.sh --managers=pip

      - name: Verify pip binaries
        run: |
          check() {
            local bin="$1"
            if command -v "$bin" >/dev/null 2>&1; then
              echo "✔  $bin  ($(command -v "$bin"))"
            else
              echo "✘  $bin  MISSING" >&2
              return 1
            fi
          }
          check pipreqs
          check ruff
          check uv

  # ── Bun / npm ────────────────────────────────────────────────────────────────
  test-bun:
    name: "Bun / npm"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bootstrap bun via its official Action; the registry entry 'bun: bun'
      # then exercises 'bun add -g bun' (self-update path).
      - uses: oven-sh/setup-bun@v2

      - name: Run installer — bun/npm provider
        # --no-skip-existing so 'bun add -g bun' is actually executed
        run: bash ci/install-binaries.sh --managers=bun --no-skip-existing

      - name: Verify bun
        run: |
          command -v bun >/dev/null 2>&1 && echo "✔  bun  ($(bun --version))" \
            || { echo "✘  bun  MISSING" >&2; exit 1; }
