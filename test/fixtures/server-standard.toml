# Test fixture: a headless Linux server on the standard tier.
# See test/fixtures/workstation-full.toml for what a fixture is.

[data]
    # Identity is NOT here: it lives in home/.chezmoidata/identity.toml, which
    # is repo data rather than a per-machine answer. Fixtures carry only what
    # `chezmoi init` actually asks.
    profile        = "server"
    tier           = "standard"
    tierRank       = 1

    secretsBackend = "none"
    gpgSign        = false
    signingKey     = ""

    fonts          = false
    terminals      = false
    autoAttach     = true
    chsh           = true
    staleness      = true
    nodeHeapMB     = 2048
