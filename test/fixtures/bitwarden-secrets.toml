# Test fixture: workstation with the Bitwarden backend enabled.
#
# Exists purely so the secrets-bearing templates are render-checked. The `bw`
# CLI is never invoked during a render — templates that call it are excluded by
# .chezmoiignore and test/render.sh honours that exclusion.

[data]
    name           = "CI Tester"
    email          = "ci@example.com"
    editor         = "nvim"

    profile        = "workstation"
    tier           = "full"
    tierRank       = 2

    secretsBackend = "bitwarden"
    gpgSign        = true
    signingKey     = "~/.ssh/id_ed25519.pub"

    fonts          = true
    terminals      = true
    autoAttach     = true
    chsh           = true
    staleness      = true
    nodeHeapMB     = 8192
