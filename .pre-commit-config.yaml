# pre-commit hooks.  Install:  mise exec pipx -- pipx install pre-commit  (or `pip install pre-commit`)
# Enable:   pre-commit install
# NOTE: chezmoi *.tmpl scripts contain Go-template syntax, so shellcheck/shfmt are
#       scoped to plain shell files and templates are excluded.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(md|markdown)$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning', '--shell=sh']
        # Only lint real shell scripts; skip Go-template (.tmpl) and zsh files.
        files: '\.sh$'
        exclude: '\.tmpl$'

  - repo: local
    hooks:
      - id: chezmoi-verify
        name: chezmoi verify (templates render)
        entry: chezmoi verify --source .
        language: system
        pass_filenames: false
        always_run: true
