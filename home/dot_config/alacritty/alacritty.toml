[general]
live_config_reload = true
ipc_socket = true

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[window]
title = "alacritty"
dynamic_title = true
decorations = "Full"
decorations_theme_variant = "Dark"
opacity = 0.92
blur = true
startup_mode = "Windowed"
resize_increments = false
dynamic_padding = false

[window.padding]
x = 6
y = 6

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 100000
multiplier = 5

[font]
size = 13.0
builtin_box_drawing = true

[font.normal]
family = "Adwaita Mono"
style = "Regular"

[font.bold]
family = "Adwaita Mono"
style = "Bold"

[font.italic]
family = "Adwaita Mono"
style = "Italic"

[font.bold_italic]
family = "Adwaita Mono"
style = "Bold Italic"

[font.offset]
x = 0
y = 1

[font.glyph_offset]
x = 0
y = 0

[colors]
draw_bold_text_with_bright_colors = true
transparent_background_colors = true

[colors.primary]
background = "#0f0f14"
foreground = "#cbd5e1"
dim_foreground = "#475569"
bright_foreground = "#e2e8f0"

[colors.cursor]
text = "CellBackground"
cursor = "#7c3aed"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "#a78bfa"

[colors.search.matches]
foreground = "#0f0f14"
background = "#7c3aed"

[colors.search.focused_match]
foreground = "#0f0f14"
background = "#a78bfa"

[colors.hints.start]
foreground = "#0f0f14"
background = "#fbbf24"

[colors.hints.end]
foreground = "#0f0f14"
background = "#f59e0b"

[colors.selection]
text = "CellForeground"
background = "#312e81"

[colors.normal]
black = "#1e1b2e"
red = "#f87171"
green = "#6d28d9"
yellow = "#facc15"
blue = "#818cf8"
magenta = "#a78bfa"
cyan = "#38bdf8"
white = "#cbd5e1"

[colors.bright]
black = "#475569"
red = "#fca5a5"
green = "#a78bfa"
yellow = "#fde68a"
blue = "#a5b4fc"
magenta = "#c4b5fd"
cyan = "#7dd3fc"
white = "#e2e8f0"

[colors.dim]
black = "#0f172a"
red = "#dc2626"
green = "#4338ca"
yellow = "#ca8a04"
blue = "#4338ca"
magenta = "#7c3aed"
cyan = "#0284c7"
white = "#94a3b8"

[bell]
animation = "EaseOutExpo"
duration = 0
color = "#7c3aed"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
unfocused_hollow = true
thickness = 0.15
blink_interval = 500
blink_timeout = 0

[cursor.style]
shape = "Beam"
blinking = "On"

[cursor.vi_mode_style]
shape = "Block"
blinking = "Off"

[terminal]
osc52 = "CopyPaste"

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Right"
action = "Paste"

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
mouse.mods = "None"
binding = { key = "U", mods = "Control|Shift" }
regex = '(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>"\\s{-}\\^⟨⟩`]+'

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "Home"
mods = "Shift"
action = "ScrollToTop"

[[keyboard.bindings]]
key = "End"
mods = "Shift"
action = "ScrollToBottom"

[[keyboard.bindings]]
key = "PageUp"
mods = "Shift"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "PageDown"
mods = "Shift"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "K"
mods = "Control|Shift"
action = "ClearLogNotice"

[[keyboard.bindings]]
key = "L"
mods = "Control|Shift"
action = "ClearHistory"

[[keyboard.bindings]]
key = "Space"
mods = "Shift|Control"
action = "ToggleViMode"

[debug]
render_timer = false
highlight_damage = false
log_level = "Warn"