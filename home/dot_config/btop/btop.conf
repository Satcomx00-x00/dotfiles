# ~/.config/btop/btop.conf
#
# The palette itself lives in themes/tokyonight.theme, generated from
# .chezmoidata/theme.toml. This file only names it, which is why this file is
# not a template.

color_theme = "tokyonight"
theme_background = False
truecolor = True
force_tty = False
vim_keys = True

shown_boxes = "cpu mem net proc"
update_ms = 1500

proc_sorting = "cpu lazy"
proc_reversed = False
proc_tree = False
proc_per_core = False
proc_mem_bytes = True

cpu_graph_upper = "total"
cpu_graph_lower = "total"
cpu_invert_lower = True
cpu_single_graph = False
check_temp = True
show_coretemp = True
temp_scale = "celsius"

mem_graphs = True
show_swap = True
show_disks = True
only_physical = True
disk_free_priv = False
show_io_stat = True

net_download = 100
net_upload = 100
net_auto = True
net_sync = True

show_battery = True
log_level = "WARNING"
