# Declarative base-package lists, consumed by
# .chezmoiscripts/run_once_before_00-install-packages.sh.tmpl
#
# Keep this to the *base* OS layer only (shell, vcs, fetchers, fonts, build deps,
# clipboard/process tools). Every modern CLI (eza/bat/fd/ripgrep/fzf/zoxide/delta/
# jq/yq/gh/lazygit/zellij/kubectl/...) is installed by mise so the binary names are
# identical on every distro (no Debian `batcat`/`fdfind`, no CentOS EPEL hunting).

[packages.base]
# Debian / Ubuntu (apt)
apt = [
    "zsh", "git", "curl", "wget", "ca-certificates", "unzip", "tar", "gzip",
    "fontconfig", "locales", "build-essential", "procps", "file", "less",
]
# Alpine (apk) — /bin/sh is BusyBox ash; pull bash+coreutils+shadow(chsh)+gcompat(glibc shim for mise tools)
apk = [
    "zsh", "git", "curl", "wget", "ca-certificates", "unzip", "tar", "gzip",
    "fontconfig", "bash", "coreutils", "shadow", "gcompat", "build-base",
    "procps", "file", "less",
]
# CentOS / RHEL / Rocky / Alma (dnf or yum) — base/AppStream only, no EPEL needed here
dnf = [
    "zsh", "git", "curl", "ca-certificates", "unzip", "tar", "gzip",
    "fontconfig", "glibc-langpack-en", "gcc", "gcc-c++", "make",
    "util-linux-user", "procps-ng", "file", "less",
]
