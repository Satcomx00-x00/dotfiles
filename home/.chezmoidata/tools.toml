    version = "latest"
    rank    = 2
    group   = "infra"
    role    = "infrastructure as code"

[[tools.list]]
    name    = "opentofu"
    backend = "aqua:opentofu/opentofu"
    version = "latest"
    rank    = 2
    group   = "infra"
    role    = "Terraform fork, installed alongside"
    bin     = "tofu"

[[tools.list]]
    name    = "awscli"
    backend = "aqua:aws/aws-cli"
    version = "latest"
    rank    = 2
    group   = "infra"
    role    = "AWS CLI v2"
    bin     = "aws"

[[tools.list]]
    name    = "ansible"
    # ansible-core, NOT the `ansible` bundle. uv/pipx only exposes the entry
    # points the requested distribution declares, and the `ansible` bundle
    # declares exactly one — `ansible-community`. The actual commands live in
    # ansible-core, so `pipx:ansible` installed ~800 collections and produced
    # no `ansible` binary at all.
    backend = "pipx:ansible-core"
    version = "latest"
    rank    = 2
    group   = "infra"
    role    = "configuration management"
    bins    = ["ansible-playbook", "ansible-galaxy", "ansible-vault"]

