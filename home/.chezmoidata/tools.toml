# The tool inventory. Single source of truth for six consumers:
#
#   ~/.config/mise/config.toml      generated by a range over this file
#   run_onchange_after_20-mise-install   re-runs when this file's hash changes
#   dotfiles doctor                 probes `bin` for every tool in the tier
#   dotfiles help                   the tool section of the generated help
#   README.md                       the inventory table, regenerated by `make docs`
#   test/assert.sh                  post-apply PATH assertions
#
# Adding a tool is ONE entry here. Nothing else is edited, and no consumer can
# fall out of step with another.
#
# Fields
#   name     mise tool name, and the display name
#   backend  fully qualified: decision #47 prefers aqua (free cosign/SLSA
#            verification), then github, then npm/pipx/go/cargo, then http
#   version  "latest" unless pinned; a pin REQUIRES a `pin` reason (make lint)
#   rank     0 minimal, 1 standard, 2 full — cumulative, index into `tiers`
#   group    display grouping for help and docs
#   role     one line, shown by `dotfiles help`
#   bin      binary name, when it differs from `name`
#   bins     extra binaries a single package provides (doctor probes all)
#   when     "wsl" — installed only on WSL2 (decision #41)
#   pin      why this version is frozen (decision #20)

[tools]
    tiers = ["minimal", "standard", "full"]

