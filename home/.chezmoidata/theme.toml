# Tokyo Night — defined once, here, as hex. Decision #8.
#
# Nothing else in this repository contains a colour literal. Every themed
# config templates its palette out of this file, which is why changing theme
# later is a one-file edit rather than an archaeology exercise.
#
# test/theme-check.sh proves this claim on every run: it mutates one value,
# re-renders, and fails if any declared consumer did NOT change (meaning it has
# a colour hardcoded) or if an undeclared one did.
#
# Consumers are listed in test/theme-consumers.txt.

[theme]
    name = "tokyonight-night"
    # Names understood by tools that ship their own Tokyo Night: bat, delta,
    # nvim, k9s. Kept here so the string is not repeated in four configs.
    bat   = "tokyonight_night"
    nvim  = "tokyonight-night"

# ─── Core palette (upstream tokyonight.nvim "night" variant) ─────────────────
[theme.palette]
    bg           = "#1a1b26"
    bg_dark      = "#16161e"
    bg_float     = "#16161e"
    bg_highlight = "#292e42"
    bg_visual    = "#283457"
    fg           = "#c0caf5"
    fg_dark      = "#a9b1d6"
    fg_gutter    = "#3b4261"
    comment      = "#565f89"
    dark3        = "#545c7e"
    dark5        = "#737aa2"

    blue         = "#7aa2f7"
    blue0        = "#3d59a1"
    blue1        = "#2ac3de"
    blue2        = "#0db9d7"
    blue5        = "#89ddff"
    blue6        = "#b4f9f8"
    blue7        = "#394b70"
    cyan         = "#7dcfff"
    magenta      = "#bb9af7"
    magenta2     = "#ff007c"
    purple       = "#9d7cd8"
    orange       = "#ff9e64"
    yellow       = "#e0af68"
    green        = "#9ece6a"
    green1       = "#73daca"
    green2       = "#41a6b5"
    teal         = "#1abc9c"
    red          = "#f7768e"
    red1         = "#db4b4b"
    black        = "#15161e"
    terminal_black = "#414868"

# ─── ANSI 16 — terminal emulators, fzf, eza, anything that speaks colour codes ─
[theme.ansi]
    black          = "#15161e"
    red            = "#f7768e"
    green          = "#9ece6a"
    yellow         = "#e0af68"
    blue           = "#7aa2f7"
    magenta        = "#bb9af7"
    cyan           = "#7dcfff"
    white          = "#a9b1d6"
    bright_black   = "#414868"
    bright_red     = "#ff7a93"
    bright_green   = "#b9f27c"
    bright_yellow  = "#ff9e64"
    bright_blue    = "#7da6ff"
    bright_magenta = "#bb9af7"
    bright_cyan    = "#0db9d7"
    bright_white   = "#c0caf5"

# ─── Semantic roles ──────────────────────────────────────────────────────────
# Consumers reference a role, not a colour. "What colour is a git addition"
# is answered once, so bat, delta, gitsigns, lualine and the prompt agree
# without any of them knowing about the others.
[theme.roles]
    added      = "#9ece6a"
    changed    = "#e0af68"
    removed    = "#f7768e"
    error      = "#db4b4b"
    warning    = "#e0af68"
    info       = "#0db9d7"
    hint       = "#1abc9c"
    ok         = "#9ece6a"
    accent     = "#7aa2f7"
    muted      = "#565f89"
    urgent     = "#ff007c"
    # Context markers used by the prompt (§8.6) and Zellij status bar.
    ctx_ssh    = "#bb9af7"
    ctx_root   = "#f7768e"
    ctx_docker = "#7dcfff"
    ctx_k8s    = "#ff9e64"

# ─── UI chrome ───────────────────────────────────────────────────────────────
[theme.ui]
    cursor            = "#c0caf5"
    cursor_text       = "#1a1b26"
    selection_bg      = "#283457"
    selection_fg      = "#c0caf5"
    border            = "#3b4261"
    border_active     = "#7aa2f7"
    statusline_bg     = "#16161e"
    statusline_fg     = "#a9b1d6"
