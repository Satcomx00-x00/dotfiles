# Tokyo Night — defined once, here, as hex. Decision #8.
#
# Nothing else in this repository contains a colour literal. Every themed
# config templates its palette out of this file, which is why changing theme
# later is a one-file edit rather than an archaeology exercise.
#
# test/theme-check.sh proves this claim on every run: it mutates one value,
# re-renders, and fails if any declared consumer did NOT change (meaning it has
# a colour hardcoded) or if an undeclared one did.
#
# Consumers are listed in test/theme-consumers.txt.

[theme]
    name = "tokyonight-night"
    # Names understood by tools that ship their own Tokyo Night: bat, delta,
    # nvim, k9s. Kept here so the string is not repeated in four configs.
    bat   = "tokyonight_night"
    nvim  = "tokyonight-night"

# ─── Core palette (upstream tokyonight.nvim "night" variant) ─────────────────
[theme.palette]
    bg           = "#1a1b26"
    bg_dark      = "#16161e"
    bg_float     = "#16161e"
    bg_highlight = "#292e42"
    bg_visual    = "#283457"
    fg           = "#c0caf5"
    fg_dark      = "#a9b1d6"
    fg_gutter    = "#3b4261"
    comment      = "#565f89"
    dark3        = "#545c7e"
    dark5        = "#737aa2"

    blue         = "#7aa2f7"
    blue0        = "#3d59a1"
    blue1        = "#2ac3de"
    blue2        = "#0db9d7"
    blue5        = "#89ddff"
    blue6        = "#b4f9f8"
    blue7        = "#394b70"
    cyan         = "#7dcfff"
    magenta      = "#bb9af7"
    magenta2     = "#ff007c"
    purple       = "#9d7cd8"
    orange       = "#ff9e64"
    yellow       = "#e0af68"
    green        = "#9ece6a"
    green1       = "#73daca"
    green2       = "#41a6b5"
    teal         = "#1abc9c"
    red          = "#f7768e"
    red1         = "#db4b4b"
    black        = "#15161e"
    terminal_black = "#414868"

# ─── ANSI 16 — Zellij's theme block ──────────────────────────────────────────
# The Tokyo Night sixteen. The terminal emulators used to read this too; they
# now carry [theme.terminal] below, so this set is Zellij's alone.
[theme.ansi]
    black          = "#15161e"
    red            = "#f7768e"
    green          = "#9ece6a"
    yellow         = "#e0af68"
    blue           = "#7aa2f7"
    magenta        = "#bb9af7"
    cyan           = "#7dcfff"
    white          = "#a9b1d6"
    bright_black   = "#414868"
    bright_red     = "#ff7a93"
    bright_green   = "#b9f27c"
    bright_yellow  = "#ff9e64"
    bright_blue    = "#7da6ff"
    bright_magenta = "#bb9af7"
    bright_cyan    = "#0db9d7"
    bright_white   = "#c0caf5"

# ─── Terminal emulators: "xcad2k dark" ───────────────────────────────────────
# Ghostty and Alacritty, and nothing else. A faithful transcription of
# github.com/ChristianLempa/dotfiles/.warp/themes/xcad2k-dark.yml — the same
# hexes, in the same slots.
#
# Read the slots below before changing anything: this palette maps the WHOLE
# ANSI ring onto one blue→violet ramp. `red` is a purple, `green` is a violet,
# `yellow` is a blue. That is the theme's entire idea — the terminal reads as
# one hue instead of a traffic light — and the cost is that raw colour output
# loses its meaning: a git diff, a failing test summary and `ls` all come out
# in shades of violet. Anything that draws its own colours on top (Neovim,
# Zellij, k9s, btop, the prompt) is unaffected and stays Tokyo Night, so the
# monochrome only shows in plain command output.
#
# It is a self-contained palette for the same reason [theme.prompt] is: the two
# emulators are the only consumers, so they own every colour they need here
# rather than borrowing half of them from a palette with a different intent.
#
# Two values are DERIVED, because the Warp format has no key for either — Warp
# paints both from its `accent`, and so do we:
#   cursor        the accent, unmodified
#   selection_bg  the accent at 30% over the background, what Warp renders
# `fg_dim` is likewise ours: midway between fg and bright black.
[theme.terminal]
    bg           = "#191919"
    fg           = "#f1f1f1"
    fg_dim       = "#a8a8a8"
    accent       = "#28b9ff"
    cursor       = "#28b9ff"
    cursor_text  = "#191919"
    selection_bg = "#1e495e"
    selection_fg = "#f1f1f1"

# The sixteen, verbatim. bright_yellow is a desaturated slate rather than
# anything on the ramp — that is upstream's value, kept rather than "fixed",
# because a faithful copy is the point.
[theme.terminal.ansi]
    black          = "#121212"
    red            = "#a52aff"
    green          = "#7129ff"
    yellow         = "#3d2aff"
    blue           = "#2b4fff"
    magenta        = "#2883ff"
    cyan           = "#28b9ff"
    white          = "#f1f1f1"
    bright_black   = "#666666"
    bright_red     = "#ba5aff"
    bright_green   = "#905aff"
    bright_yellow  = "#657b83"
    bright_blue    = "#5c78ff"
    bright_magenta = "#5ea2ff"
    bright_cyan    = "#5ac8ff"
    bright_white   = "#ffffff"

# ─── Semantic roles ──────────────────────────────────────────────────────────
# Consumers reference a role, not a colour. "What colour is a git addition"
# is answered once, so bat, delta, gitsigns, lualine and the prompt agree
# without any of them knowing about the others.
[theme.roles]
    added      = "#9ece6a"
    changed    = "#e0af68"
    removed    = "#f7768e"
    error      = "#db4b4b"
    warning    = "#e0af68"
    info       = "#0db9d7"
    hint       = "#1abc9c"
    ok         = "#9ece6a"
    accent     = "#7aa2f7"
    muted      = "#565f89"
    urgent     = "#ff007c"

# ─── Prompt: "neo purple" ────────────────────────────────────────────────────
# The prompt does NOT use the Tokyo Night palette above, and that is the point.
# Tokyo Night's purples (#9d7cd8, #bb9af7) are desaturated pastels designed to
# sit quietly behind syntax for hours; a prompt has the opposite job. This is a
# neon violet ramp on the same near-black background — high chroma, wide
# lightness spread — so the prompt reads as its own object rather than as more
# editor chrome that happens to be in the terminal.
#
# It is a self-contained palette: the prompt is the only consumer, so it owns
# every colour it needs, here, rather than borrowing half of them from
# [theme.roles] and drifting from that palette's intent at the next retheme.
#
# ── The ramp: one hue, five steps ────────────────────────────────────────────
# Everything ambient — path, branch, versions, jobs, clock — is one of these.
# Position encodes how often you need the thing, and the contrast ratios below
# (against bg #1a1b26) are the actual design: each step is ~1.5x the last, so
# five levels stay separable instead of collapsing into "some purples".
[theme.prompt]
    shade  = "#5a189a"  # 1.7:1  rail and separators — structure, never read
    dim    = "#7b2cbf"  # 2.4:1  ambient — versions, timings, the clock
    core   = "#a855f7"  # 4.3:1  structure you do read — branch, the caret
    bright = "#c77dff"  # 6.4:1  the anchor — repo root, the path you are in
    peak   = "#e0aaff"  # 9.2:1  a mode change (vim normal)

    # ── The exceptions: the only hue in the prompt ───────────────────────────
    # Because everything else is one violet, ANY other hue is information, and
    # the eye finds it without reading. Kept at neon saturation to match the
    # ramp — a pastel warning next to a neon path reads as a rendering bug.
    # Each answers a different version of "you are not where you think you
    # are", so they must stay separable from each other, not just from purple.
    alert  = "#ff2e88"  # rose   — it failed, or it needs a decision from you
    root   = "#ff4040"  # red    — you are root
    ssh    = "#00e5ff"  # cyan   — you are on another host
    docker = "#00ffa3"  # mint   — you are inside a container
    k8s    = "#ff9f1c"  # amber  — you are pointed at a cluster
    cloud  = "#ffd60a"  # yellow — you have a cloud profile assumed

# ─── UI chrome ───────────────────────────────────────────────────────────────
[theme.ui]
    cursor            = "#c0caf5"
    cursor_text       = "#1a1b26"
    selection_bg      = "#283457"
    selection_fg      = "#c0caf5"
    border            = "#3b4261"
    border_active     = "#7aa2f7"
    statusline_bg     = "#16161e"
    statusline_fg     = "#a9b1d6"
